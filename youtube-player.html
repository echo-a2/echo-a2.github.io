<!DOCTYPE html>
<html>
<head>
<title></title>
</head>
<body>
<script>
var u = prompt("Please enter youtube url");
var m = u && u.match(/(?:v=|youtu\.be\/|shorts\/|embed\/|live\/)([\w-]{11})/);
if (m) document.write('<iframe src="https://www.youtube.com/embed/' + m[1] + '?autoplay=1" style="position:fixed;top:0;left:0;width:100%;height:100%;border:0" allow="autoplay; fullscreen" allowfullscreen></iframe>');
</script>
</body>
</html>
