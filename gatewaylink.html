<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gateway links</title>
<style>
:root{--bg:#e8ecef;--ink:#16212b;--mut:#5d6b78;--panel:#fff;--line:#c9d2da;--acc:#0a6c85;--ok:#1b7f3b;--bad:#a8281f}
@media(prefers-color-scheme:dark){:root{--bg:#10171d;--ink:#e3e9ee;--mut:#8d9ba8;--panel:#18222b;--line:#2b3946;--acc:#5cc3dd;--ok:#5fd07f;--bad:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 ui-sans-serif,system-ui,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:max(1.25rem,env(safe-area-inset-top)) 1rem 3rem}
h1{font-size:1.6rem;margin:0 0 1.25rem;letter-spacing:-.01em}
section{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:1.1rem}
.row{display:flex;align-items:center;gap:.7rem;padding:.6rem 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row div{flex:1;min-width:0}.row small{display:block;color:var(--mut);overflow-wrap:anywhere}
.dot{width:.7rem;height:.7rem;border-radius:50%;background:var(--mut)}
.up{background:var(--ok)}.down{background:var(--bad)}
a.btn,button{display:inline-block;padding:.7rem 1rem;background:var(--acc);color:#fff;border:0;border-radius:4px;font:inherit;text-decoration:none;cursor:pointer;touch-action:manipulation}
@media(prefers-color-scheme:dark){a.btn,button{color:#08222a}}
input{width:100%;min-height:2.75rem;padding:.55rem .65rem;margin:0 0 .6rem;font:inherit;color:inherit;background:transparent;border:1px solid var(--line);border-radius:4px}
.mut{color:var(--mut)}.err{color:var(--bad);min-height:1.5rem}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
</style></head><body><main><h1>Gateway links</h1><section id="app">Loading...</section></main>
<script>
const app = document.getElementById('app');
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
// sessionStorage, not localStorage: other pages on the same site can't read it after the tab closes
const store = { get: () => { try { return sessionStorage.getItem('gwpass'); } catch (e) { return null; } },
                set: v => { try { sessionStorage.setItem('gwpass', v); } catch (e) {} } };

async function decrypt(box, pass) {
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(box.salt), iterations: 600000, hash: 'SHA-256' },
    km, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(box.iv) }, key, b64(box.data))));
}
function alive(url) { // reachable if the request completes at all (the reply itself is opaque)
  const ctl = new AbortController(); setTimeout(() => ctl.abort(), 7000);
  return fetch(url, { mode: 'no-cors', cache: 'no-store', signal: ctl.signal }).then(() => true, () => false);
}
function show(d) {
  const mins = Math.max(0, Math.round((Date.now() - new Date(d.updated)) / 60000));
  if (!d.urls.length) { app.innerHTML = '<p>Everything is offline right now.</p><p class=mut>Updated ' + mins + ' min ago.</p>'; return; }
  app.innerHTML = d.urls.map((u, i) => '<div class=row><span class=dot id=d' + i + '></span><div>' + u.name +
    '<small>' + u.url + '</small></div><a class=btn href="' + u.url + '">Open</a></div>').join('') +
    '<p class=mut>Updated ' + mins + ' min ago. A green dot means the link answered just now.</p>';
  d.urls.forEach((u, i) => alive(u.url).then(ok => document.getElementById('d' + i).className = 'dot ' + (ok ? 'up' : 'down')));
}
function ask(box, msg) {
  app.innerHTML = '<input id=p type=password placeholder="Passphrase" autocomplete=current-password><div class=err>' + (msg || '') + '</div><button id=go>Unlock</button>';
  const go = async () => {
    const p = document.getElementById('p').value;
    try { const d = await decrypt(box, p); store.set(p); show(d); } catch (e) { ask(box, 'Wrong passphrase'); }
  };
  document.getElementById('go').onclick = go;
  document.getElementById('p').onkeydown = e => e.key === 'Enter' && go();
}
(async () => {
  let box;
  try { box = await (await fetch('urls.json?' + Date.now(), { cache: 'no-store' })).json(); }
  catch (e) { app.textContent = 'Could not load the list.'; return; }
  if (!box.salt) return show(box);
  const saved = store.get();
  if (saved) { try { return show(await decrypt(box, saved)); } catch (e) {} }
  ask(box);
})();
</script></body></html>
