<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>loading</title>
</head>
<body>
loading
<script>
var DIR = "mindustry-parts/";

function pad(i) { return ("000" + i).slice(-3); }

function getPart(i) {
  return fetch(DIR + "part" + pad(i) + ".bin").then(function (r) {
    if (!r.ok) throw new Error("part " + i + " HTTP " + r.status);
    return r.blob();
  });
}

fetch(DIR + "manifest.json")
  .then(function (r) {
    if (!r.ok) throw new Error("manifest HTTP " + r.status);
    return r.json();
  })
  .then(function (m) {
    var jobs = [];
    for (var i = 0; i < m.parts; i++) jobs.push(getPart(i));
    return Promise.all(jobs);
  })
  .then(function (blobs) {
    var stream = new Blob(blobs).stream().pipeThrough(new DecompressionStream("gzip"));
    return new Response(stream).blob();
  })
  .then(function (blob) {
    var page = new Blob([blob], { type: "text/html" });
    var frame = document.createElement("iframe");
    frame.setAttribute("allow", "fullscreen; autoplay; gamepad; clipboard-read; clipboard-write");
    frame.setAttribute("allowfullscreen", "");
    frame.style.cssText = "position:fixed;top:0;left:0;width:100%;height:100%;border:0;background:#fff";
    frame.src = URL.createObjectURL(page);
    document.body.textContent = "";
    document.body.appendChild(frame);
  })
  .catch(function (e) {
    document.body.textContent = "failed to load: " + e.message;
  });
</script>
</body>
</html>
