<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>loading</title>
</head>
<body>
loading
<script>
var TARGET = "https://ia801608.us.archive.org/34/items/mindustry-web-port/Mindustry.html";

function startDownload() {
  var a = document.createElement("a");
  a.href = TARGET + (TARGET.indexOf("?") < 0 ? "?" : "&") + "download=1";
  a.download = "Mindustry.html";
  document.body.appendChild(a);
  a.click();
}

fetch(TARGET)
  .then(function (r) {
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.blob();
  })
  .then(function (blob) {
    return new Blob([blob], { type: "text/html" }).text();
  })
  .then(function (html) {
    document.open();
    document.write(html);
    document.close();
  })
  .catch(function (e) {
    document.body.textContent = "failed to load: " + e.message + " (starting download instead)";
    startDownload();
  });
</script>
</body>
</html>
