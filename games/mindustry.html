<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>loading</title>
</head>
<body>
loading
<script>
fetch("https://ia801608.us.archive.org/34/items/mindustry-web-port/Mindustry.html")
  .then(function (r) {
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.text();
  })
  .then(function (html) {
    document.open();
    document.write(html);
    document.close();
  })
  .catch(function (e) {
    document.body.textContent = "failed to load: " + e.message;
  });
</script>
</body>
</html>
