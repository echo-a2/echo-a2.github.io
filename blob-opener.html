<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure File Viewer</title>
</head>
<body>
    <div>
        <h1>Secure File Viewer</h1>
        <p>Open files safely with blob URLs and sandboxing</p>

        <div>
            <label for="fileInput">
                <div>Click to select a file or drag & drop</div>
                <div id="fileName"></div>
            </label>
            <input type="file" id="fileInput">
        </div>

        <div>
            <label>
                <input type="radio" name="mode" value="standard" checked>
                Standard Mode - Open in new tab with blob URL
            </label>

            <label>
                <input type="radio" name="mode" value="sandbox">
                Sandboxed Mode - Embed in about:blank (more secure)
            </label>
        </div>

        <div>
            <button id="openBtn" disabled>Open File</button>
            <button id="resetBtn" disabled>Clear</button>
        </div>

        <div id="status"></div>
        <div id="fileInfo"></div>
    </div>

    <script>
        let selectedFile = null;
        const blobUrls = [];

        const fileInput = document.getElementById('fileInput');
        const fileName = document.getElementById('fileName');
        const openBtn = document.getElementById('openBtn');
        const resetBtn = document.getElementById('resetBtn');
        const status = document.getElementById('status');
        const fileInfo = document.getElementById('fileInfo');
        const fileLabel = fileInput.parentElement.querySelector('label');

        fileInput.addEventListener('change', () => {
            setSelectedFile(fileInput.files[0]);
        });

        fileLabel.addEventListener('dragover', (e) => {
            e.preventDefault();
        });

        fileLabel.addEventListener('drop', (e) => {
            e.preventDefault();
            if (e.dataTransfer.files.length) {
                setSelectedFile(e.dataTransfer.files[0]);
            }
        });

        function setSelectedFile(file) {
            selectedFile = file || null;

            if (selectedFile) {
                fileName.textContent = selectedFile.name;
                fileInfo.innerHTML = `
                    <strong>File:</strong> ${selectedFile.name}<br>
                    <strong>Size:</strong> ${(selectedFile.size / 1024).toFixed(2)} KB<br>
                    <strong>Type:</strong> ${selectedFile.type || 'Unknown'}
                `;
                openBtn.disabled = false;
                resetBtn.disabled = false;
                clearStatus();
            }
        }

        openBtn.addEventListener('click', () => {
            if (!selectedFile) return;

            const mode = document.querySelector('input[name="mode"]:checked').value;

            try {
                if (mode === 'sandbox') {
                    openInSandbox(selectedFile);
                    showStatus('Opening in sandboxed mode (about:blank)...', 'success');
                } else {
                    openInStandardMode(selectedFile);
                    showStatus('Opening in standard mode...', 'success');
                }
            } catch (error) {
                showStatus(`Error: ${error.message}`, 'error');
            }
        });

        // Opens a blank tab first (inherits this page's origin), then navigates
        // it to the blob URL. Passing the blob URL straight into window.open()
        // creates a fresh browsing context that doesn't resolve blob: URLs
        // reliably (this is what causes "blob:null" failures, especially when
        // this file is opened directly from disk via file://).
        function openInStandardMode(file) {
            const blobUrl = URL.createObjectURL(file);
            blobUrls.push(blobUrl);

            const win = window.open('about:blank', '_blank');
            if (!win) {
                throw new Error('Unable to open new window. Check popup blocker settings.');
            }
            win.location.href = blobUrl;
        }

        function openInSandbox(file) {
            const sandboxWindow = window.open('about:blank', '_blank');

            if (!sandboxWindow) {
                throw new Error('Unable to open new window. Check popup blocker settings.');
            }

            const isTextFile = file.type.startsWith('text/') ||
                             file.type.includes('javascript') ||
                             file.type.includes('json') ||
                             file.type.includes('xml') ||
                             file.type.includes('html');

            if (isTextFile) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const html = `
                        <!DOCTYPE html>
                        <html>
                        <head>
                            <meta charset="UTF-8">
                            <title>File Viewer (Sandboxed)</title>
                        </head>
                        <body>
                            <p>File opened in sandboxed mode (about:blank)</p>
                            <pre>${escapeHtml(e.target.result)}</pre>
                        </body>
                        </html>
                    `;
                    sandboxWindow.document.write(html);
                    sandboxWindow.document.close();
                };
                reader.onerror = () => {
                    sandboxWindow.document.write('Error reading file.');
                    sandboxWindow.document.close();
                };
                reader.readAsText(file);
            } else {
                const blobUrl = URL.createObjectURL(file);
                blobUrls.push(blobUrl);

                const html = `
                    <!DOCTYPE html>
                    <html>
                    <head>
                        <meta charset="UTF-8">
                        <title>File Viewer (Sandboxed)</title>
                    </head>
                    <body>
                        <p>File opened in sandboxed mode (about:blank)</p>
                        <iframe src="${blobUrl}" title="File Viewer" style="width:100%;height:80vh;border:none;"></iframe>
                    </body>
                    </html>
                `;
                sandboxWindow.document.write(html);
                sandboxWindow.document.close();
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        resetBtn.addEventListener('click', () => {
            selectedFile = null;
            fileInput.value = '';
            fileName.textContent = '';
            fileInfo.innerHTML = '';
            openBtn.disabled = true;
            resetBtn.disabled = true;
            clearStatus();
        });

        function showStatus(message, type) {
            status.textContent = `[${type}] ${message}`;
        }

        function clearStatus() {
            status.textContent = '';
        }

        // Release all blob URLs when this page is closed/navigated away from.
        window.addEventListener('beforeunload', () => {
            blobUrls.forEach(url => URL.revokeObjectURL(url));
        });
    </script>
</body>
</html>
