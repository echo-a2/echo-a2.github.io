<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Redirect</title>
</head>
<body>

<input type="text" id="url" value="https://example.com" size="40">
<button id="go">Go</button>

<p><a id="link" href="https://example.com">https://example.com</a></p>

<script>
var box = document.getElementById("url");
var link = document.getElementById("link");

function fix(u) {
  u = u.trim();
  if (u && !/^[a-z][a-z0-9+.-]*:/i.test(u)) u = "https://" + u;
  return u;
}

// keep the hyperlink in sync with the textbox
box.addEventListener("input", function () {
  var u = fix(box.value);
  link.href = u;
  link.textContent = u;
});

// button redirects to whatever is in the box
document.getElementById("go").addEventListener("click", function () {
  var u = fix(box.value);
  if (u) window.location.href = u;
});

// Enter key also redirects
box.addEventListener("keydown", function (e) {
  if (e.key === "Enter") document.getElementById("go").click();
});
</script>

</body>
</html>
