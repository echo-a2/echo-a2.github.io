<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loading…</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #ddd; font-family: system-ui, sans-serif; }
  iframe { border: 0; width: 100%; height: 100%; display: block; }
  #msg { display: flex; align-items: center; justify-content: center; height: 100%; text-align: center; padding: 1rem; }
</style>
</head>
<body>
<div id="msg">Loading…</div>
<script>
/*
  Save as 404.html in the repo root. GitHub Pages serves it for any URL with no real file:
    yoursite.github.io/repo/blob-opener   ->  loads blob-opener.html
    yoursite.github.io/repo/mindustry     ->  loads mindustry.html (or games/mindustry.html)
  Your index.html is not touched.

  BASE    = the folder your site lives in.
            Project site (user.github.io/repo/)  -> "/repo/"
            User site or custom domain (root)    -> "/"
  FOLDERS = places to look for <name>.html, in order. "" is the repo root.
            Add folders here as you organise things (e.g. "games/", "tools/").
  Query strings and #hashes are passed through to the loaded page, so
  /url-redirector?u=... still reaches url-redirector.html.
*/
const BASE = "/";                       // <-- "/your-repo-name/" for a project site
const FOLDERS = ["", "games/", "tools/"];

function getName() {
  let path = location.pathname;
  if (path.startsWith(BASE)) path = path.slice(BASE.length);
  path = path.replace(/^\/+|\/+$/g, "").replace(/\.html$/i, "");
  return path.split("/")[0];
}

async function exists(url) {
  try { return (await fetch(url, { method: "HEAD", cache: "no-store" })).ok; }
  catch (e) { return false; }
}

async function load() {
  const msg = document.getElementById("msg");
  const name = getName().toLowerCase().replace(/[^a-z0-9_-]/g, "");
  if (!name || name === "404" || name === "index") { msg.textContent = "Page not found"; return; }

  for (const folder of FOLDERS) {
    const file = BASE + folder + name + ".html";
    if (await exists(file)) {
      document.title = name;
      const frame = document.createElement("iframe");
      frame.src = file + location.search + location.hash;
      frame.allow = "fullscreen; autoplay; gamepad; clipboard-write; encrypted-media; picture-in-picture";
      frame.allowFullscreen = true;
      document.body.replaceChildren(frame);
      return;
    }
  }
  msg.textContent = "Couldn't find " + name + ".html";
}
load();
</script>
</body>
</html>
