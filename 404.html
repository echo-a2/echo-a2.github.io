<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loading…</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #ddd; font-family: system-ui, sans-serif; }
  iframe { border: 0; width: 100%; height: 100%; display: block; }
  #msg { display: flex; align-items: center; justify-content: center; height: 100%; text-align: center; padding: 1rem; }
</style>
</head>
<body>
<div id="msg">Loading…</div>
<script>
/*
  Save as 404.html in the repo root. GitHub Pages serves it for any URL with no real file:
    yoursite.github.io/mindustry              -> loads games/mindustry.html,
                                                 and the address bar becomes /mindustry-aB3dE9fGh2
    yoursite.github.io/mindustry-aB3dE9fGh2   -> still loads games/mindustry.html (suffix is ignored)
  Your index.html is not touched.

  BASE    = the folder your site lives in.
            Project site (user.github.io/repo/)  -> "/repo/"
            User site or custom domain (root)    -> "/"
  FOLDERS = places to look for <name>.html, in order. "" is the repo root.
  Query strings and #hashes are passed through to the loaded page.
*/
const BASE = "/";                       // <-- "/your-repo-name/" for a project site
const FOLDERS = ["", "games/", "tools/"];
const ID_LEN = 10;
const CHARS = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";

function randomId() {
  let out = "";
  const buf = new Uint8Array(32);
  while (out.length < ID_LEN) {
    crypto.getRandomValues(buf);
    for (const b of buf) {
      if (b < 248 && out.length < ID_LEN) out += CHARS[b % 62];  // 248 = 62*4, avoids bias
    }
  }
  return out;
}

// Returns the names to try, in order. The full name is tried first so a real
// page like "url-redirector" isn't mistaken for "name + 10-character id".
function getCandidates() {
  let path = location.pathname;
  if (path.startsWith(BASE)) path = path.slice(BASE.length);
  path = path.replace(/^\/+|\/+$/g, "").replace(/\.html$/i, "");
  const seg = path.split("/")[0];
  const clean = s => s.toLowerCase().replace(/[^a-z0-9_-]/g, "");
  const list = [{ name: clean(seg), hasId: false }];
  const m = seg.match(/^(.+)-([A-Za-z0-9]{10})$/);
  if (m) list.push({ name: clean(m[1]), hasId: true });
  return list;
}

async function exists(url) {
  try { return (await fetch(url, { method: "HEAD", cache: "no-store" })).ok; }
  catch (e) { return false; }
}

async function load() {
  const msg = document.getElementById("msg");
  for (const { name, hasId } of getCandidates()) {
    if (!name || name === "404" || name === "index") continue;
    for (const folder of FOLDERS) {
      const file = BASE + folder + name + ".html";
      if (await exists(file)) {
        document.title = name;
        if (!hasId) {
          history.replaceState(null, "", BASE + name + "-" + randomId() + location.search + location.hash);
        }
        const frame = document.createElement("iframe");
        frame.src = file + location.search + location.hash;
        frame.allow = "fullscreen; autoplay; gamepad; clipboard-write; encrypted-media; picture-in-picture";
        frame.allowFullscreen = true;
        document.body.replaceChildren(frame);
        return;
      }
    }
  }
  msg.textContent = "Page not found";
}
load();
</script>
</body>
</html>
